[project]
name = "montecarlo-simulation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mardin Nasouti", email = "info@mardin.cc" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.2.0",
    "scipy>=1.10.0",
]

[project.scripts]
montecarlo-simulation = "montecarlo_simulation.run_lod_simulations:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
